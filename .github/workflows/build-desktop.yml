name: Presence Studio Desktop Windows
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'extension/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node desktop service code
        shell: bash
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check core.cjs
          node --check ../extension/service-worker.js
          node --check ../extension/relay.js
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Run presence policy tests
        run: npm test
      - name: Build React renderer and typecheck
        run: npm run build
      - name: Smoke test Electron renderer and local IPC on Windows
        run: npm run smoke
      - name: Build true portable Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package
      - name: Package extension ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path '../extension/*' -DestinationPath 'dist-release/MediaFlowPresenceStudio-extension-v20.507.zip' -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlowPresenceStudio-v20.507-React-Windows
          path: |
            desktop/dist-release/*.exe
            desktop/dist-release/*.zip
          if-no-files-found: error
      - name: Publish new desktop assets to v20.507 Beta
        if: "${{ contains(github.event.head_commit.message, 'release: v20.507 desktop') }}"
        shell: pwsh
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          $files = @((Get-ChildItem -Path dist-release -File | Where-Object { $_.Name -in @('MediaFlowPresenceStudio-v20.507-portable.exe','MediaFlowPresenceStudio-extension-v20.507.zip') }) | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw 'Release artifacts missing' }
          gh release upload 20.507 $files --repo "${{ github.repository }}" --clobber
          gh release delete-asset 20.507 MediaFlowPresenceStudio-v20.507-windows-portable.zip --repo "${{ github.repository }}" --yes 2>$null; $global:LASTEXITCODE = 0
          gh release delete-asset 20.507 elevate.exe --repo "${{ github.repository }}" --yes 2>$null; $global:LASTEXITCODE = 0
          gh release delete-asset 20.507 MediaFlow.Presence.Studio.exe --repo "${{ github.repository }}" --yes 2>$null; $global:LASTEXITCODE = 0
          gh release edit 20.507 --repo "${{ github.repository }}" --title 'v20.507 Beta — Desktop Presence Studio' --prerelease --notes 'v20.507 Desktop Presence Studio Beta. MediaFlow Personal v507 and MediaFlow Plus by Alex Godly v437 supported baselines. React/Electron portable Windows EXE; bundled Chromium extension; Discord IPC; native tray; automatic/manual/off presence; detailed per-title/page/category/status/edition activity rules; artwork and profile controls; level/streak/XP and progress text; activity timers; privacy-first local library catalogue with 100k-title stress tests, JSON/CSV import, browsing/search/filter/pagination; dynamic appearance, themes and presets; Personal/Plus PWA/website launcher and guided browser installation; settings export/import; update checks and official update download. CI validates Windows UI navigation, IPC, content-script syntax, 100k indexing and portable packaging. BETA LIMITATIONS: Discord app-header overrides, live account/Windows behavior and comprehensive PWA handling still require real hardware testing; Chromium installation approval cannot be bypassed; local images are preview-only until publicly hosted/registered as Discord assets; changes to either MediaFlow may need adapters.'
          gh api -X PATCH "/repos/${{ github.repository }}/git/refs/tags/20.507" -f sha="${{ github.sha }}" -F force=true | Out-Null
