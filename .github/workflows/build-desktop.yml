name: Presence Studio Desktop Windows
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'extension/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node desktop service code
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check core.cjs
          node --check ../extension/service-worker.js
          node --check ../extension/relay.js
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Run presence policy tests
        run: npm test
      - name: Build React renderer and typecheck
        run: npm run build
      - name: Build true portable Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package
      - name: Package extension ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path '../extension/*' -DestinationPath 'dist-release/MediaFlowPresenceStudio-extension-v20.507.zip' -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlowPresenceStudio-v20.507-React-Windows
          path: |
            desktop/dist-release/*.exe
            desktop/dist-release/*.zip
          if-no-files-found: error
      - name: Publish new desktop assets to v20.507 Beta
        if: "${{ contains(github.event.head_commit.message, 'release: v20.507 desktop') }}"
        shell: pwsh
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          $files = @((Get-ChildItem -Path dist-release -File | Where-Object { $_.Name -in @('MediaFlowPresenceStudio-v20.507-portable.exe','MediaFlowPresenceStudio-extension-v20.507.zip') }) | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw 'Release artifacts missing' }
          gh release upload 20.507 $files --repo "${{ github.repository }}" --clobber
          gh release delete-asset 20.507 MediaFlowPresenceStudio-v20.507-windows-portable.zip --repo "${{ github.repository }}" --yes 2>$null; $global:LASTEXITCODE = 0
          gh release delete-asset 20.507 elevate.exe --repo "${{ github.repository }}" --yes 2>$null; $global:LASTEXITCODE = 0
          gh release delete-asset 20.507 MediaFlow.Presence.Studio.exe --repo "${{ github.repository }}" --yes 2>$null; $global:LASTEXITCODE = 0
          gh release edit 20.507 --repo "${{ github.repository }}" --title 'v20.507 Beta — Desktop Presence Studio' --prerelease --notes 'New Electron + React portable EXE for MediaFlow Personal v507 and Plus v436. Includes a native Windows tray, Discord IPC, automatic/manual/off modes, presence templates, configurable statistics and activity visibility, title and profile artwork controls, independent edition rules, presets, appearance themes, connection diagnostics, PWA/website launching, and guided bundled extension setup. IMPORTANT: This remains a beta because live Discord and PWA integration require Windows testing, automated PWA/extension installation is browser-restricted, full cloud-library search and public hosting for locally selected Discord artwork are not implemented, and changing the app display name depends on Discord client support.'
          gh api -X PATCH "/repos/${{ github.repository }}/git/refs/tags/20.507" -f sha="${{ github.sha }}" -F force=true | Out-Null
